<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>SEO Inspector</title>
    <link rel="stylesheet" href="base.css" />
    <link rel="stylesheet" href="theme.css" />
  </head>
  <body>
    <header class="header">
      <div class="brand">
        <img src="../../icons/icon32.png" alt="" width="18" height="18" />
        <span>SEO Inspector</span>
      </div>
      <div id="summary" class="summary" aria-live="polite"></div>
      <span id="pro" class="pro-slot"></span>
    </header>

    <div id="toolbar" class="toolbar" hidden>
      <label class="toggle">
        <input type="checkbox" id="only-issues" />
        <span>Issues only</span>
      </label>
      <div class="toolbar__group">
        <button type="button" id="copy" class="btn">Copy</button>
        <button type="button" id="export" class="btn">Export JSON</button>
      </div>
    </div>

    <main id="main" class="main">
      <p class="state state--loading">Analysing page&hellip;</p>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

    <script type="module" src="popup.js"></script>
  </body>
</html>
