<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Link Extractor</title>
    <link rel="stylesheet" href="base.css" />
    <link rel="stylesheet" href="theme.css" />
  </head>
  <body>
    <header class="header">
      <div class="brand">
        <img src="../../icons/icon32.png" alt="" width="18" height="18" />
        <span>Link Extractor</span>
      </div>
      <div id="summary" class="summary" aria-live="polite"></div>
    </header>

    <div id="toolbar" class="toolbar" hidden>
      <div class="toolbar__group">
        <select id="scope" class="select" aria-label="Link type"></select>
        <input id="search" class="search" type="search" placeholder="Filter&hellip;" aria-label="Filter links" />
      </div>
      <div class="toolbar__group">
        <label class="toggle">
          <input type="checkbox" id="dedupe" />
          <span>Unique</span>
        </label>
        <button type="button" id="copy" class="btn">Copy</button>
        <button type="button" id="export" class="btn">CSV</button>
      </div>
    </div>

    <main id="main" class="main">
      <p class="state state--loading">Reading links&hellip;</p>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

    <script type="module" src="popup.js"></script>
  </body>
</html>
