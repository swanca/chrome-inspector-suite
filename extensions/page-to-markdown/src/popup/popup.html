<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Page to Markdown</title>
    <link rel="stylesheet" href="base.css" />
    <link rel="stylesheet" href="theme.css" />
  </head>
  <body>
    <header class="header">
      <div class="brand">
        <img src="../../icons/icon32.png" alt="" width="18" height="18" />
        <span>Page to Markdown</span>
      </div>
      <div id="summary" class="summary" aria-live="polite"></div>
    </header>

    <div id="toolbar" class="toolbar" hidden>
      <div class="toolbar__group">
        <label class="toggle">
          <input type="checkbox" id="links" checked />
          <span>Links</span>
        </label>
        <label class="toggle">
          <input type="checkbox" id="images" checked />
          <span>Images</span>
        </label>
        <label class="toggle">
          <input type="checkbox" id="front-matter" />
          <span>Front matter</span>
        </label>
      </div>
      <div class="toolbar__group">
        <button type="button" id="copy" class="btn">Copy</button>
        <button type="button" id="export" class="btn">.md</button>
      </div>
    </div>

    <main id="main" class="main">
      <p class="state state--loading">Reading page&hellip;</p>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

    <script type="module" src="popup.js"></script>
  </body>
</html>
