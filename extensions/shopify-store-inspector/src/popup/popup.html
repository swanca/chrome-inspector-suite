<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Shopify Store Inspector</title>
    <link rel="stylesheet" href="base.css" />
    <link rel="stylesheet" href="theme.css" />
  </head>
  <body>
    <header class="header">
      <div class="brand">
        <img src="../../icons/icon32.png" alt="" width="18" height="18" />
        <span>Shopify</span>
      </div>
      <div id="summary" class="summary" aria-live="polite"></div>
    </header>

    <div id="toolbar" class="toolbar" hidden>
      <div class="toolbar__group" id="views" role="tablist" aria-label="View">
        <button type="button" class="btn btn--active" id="view-audit" data-view="audit" role="tab">Audit</button>
        <button type="button" class="btn" id="view-details" data-view="details" role="tab">Details</button>
        <button type="button" class="btn" id="view-variants" data-view="variants" role="tab">Variants</button>
      </div>
      <div class="toolbar__group">
        <button type="button" id="copy" class="btn">Copy</button>
        <button type="button" id="export" class="btn">CSV</button>
      </div>
    </div>

    <main id="main" class="main">
      <p class="state state--loading">Inspecting the storefront&hellip;</p>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

    <script type="module" src="popup.js"></script>
  </body>
</html>
