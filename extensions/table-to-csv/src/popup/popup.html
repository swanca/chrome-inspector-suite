<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Table to CSV</title>
    <link rel="stylesheet" href="base.css" />
    <link rel="stylesheet" href="theme.css" />
  </head>
  <body>
    <header class="header">
      <div class="brand">
        <img src="../../icons/icon32.png" alt="" width="18" height="18" />
        <span>Table to CSV</span>
      </div>
      <div id="summary" class="summary" aria-live="polite"></div>
    </header>

    <div id="toolbar" class="toolbar" hidden>
      <div class="toolbar__group">
        <select id="table" class="select" aria-label="Table to convert"></select>
      </div>
      <div class="toolbar__group">
        <select id="delimiter" class="select" aria-label="CSV delimiter">
          <option value=",">Comma</option>
          <option value=";">Semicolon</option>
          <option value="&#9;">Tab</option>
        </select>
        <button type="button" id="copy" class="btn">Copy</button>
        <button type="button" id="export" class="btn">CSV</button>
      </div>
    </div>

    <div id="options" class="toolbar" hidden>
      <label class="toggle">
        <input type="checkbox" id="trim" checked />
        <span>Drop empty rows and columns</span>
      </label>
    </div>

    <main id="main" class="main">
      <p class="state state--loading">Looking for tables&hellip;</p>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

    <script type="module" src="popup.js"></script>
  </body>
</html>
