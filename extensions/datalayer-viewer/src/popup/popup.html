<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>DataLayer Viewer</title>
    <link rel="stylesheet" href="base.css" />
    <link rel="stylesheet" href="theme.css" />
  </head>
  <body>
    <header class="header">
      <div class="brand">
        <img src="../../icons/icon32.png" alt="" width="18" height="18" />
        <span>DataLayer</span>
      </div>
      <div id="summary" class="summary" aria-live="polite"></div>
      <span id="pro" class="pro-slot"></span>
    </header>

    <div id="toolbar" class="toolbar" hidden>
      <div class="toolbar__group">
        <select id="layer" class="select" aria-label="Data layer"></select>
        <select id="event" class="select" aria-label="Event"></select>
      </div>
      <div class="toolbar__group">
        <button type="button" id="refresh" class="btn" title="Read the page again">Refresh</button>
        <button type="button" id="export" class="btn">JSON</button>
      </div>
    </div>

    <div id="options" class="toolbar" hidden>
      <input id="search" class="search" type="search" placeholder="Search keys and values&hellip;" aria-label="Search the data layer" />
      <button type="button" id="copy" class="btn">Copy</button>
    </div>

    <main id="main" class="main">
      <p class="state state--loading">Reading the page&hellip;</p>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

    <script type="module" src="popup.js"></script>
  </body>
</html>
